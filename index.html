<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Void Survivor v6.0 — Глубже Бездны</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 1. Подключаем VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            // Пробуем разные варианты имени объекта
            var bridge = window.vkBridge || (window.vkontakte && window.vkontakte.vkBridge);
            if (bridge) {
                bridge.send('VKWebAppInit');
                console.log('VK INIT SUCCESS');
            } else {
                console.log('VK INIT FAILED');
            }
        });
    </script>

    <script src="sprites.js"></script>
    <script src="game.js"></script>
</body>
</html>
